<!DOCTYPE html>
<html>
<head>
    <title>cloud app</title>
    <style>
        body{
            font-family: Arial;
            background: linear-gradient(135deg,#070513,#1a1229);
            color:white;
            margin:0;

            height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
        }
#currentUser{
    margin-bottom:15px;
    color:#bbb;
    font-size:14px;
}
        .box{
            background:#1f1b2e;
            padding:30px;
            width:520px;
            border-radius:12px;
            box-shadow:0 0 25px rgba(0,0,0,0.5);

            text-align:center; /* ✅ centers content */
        }

        h1{
            margin-bottom:20px;
        }

        .section{
            margin-bottom:20px;
        }

        .row{
            display:flex;
            justify-content:center; /* ✅ center row content */
            gap:10px;
            align-items:center;
        }

        button{
            padding:7px 14px;
            border:none;
            border-radius:6px;
            background:#6c5ce7;
            color:white;
            cursor:pointer;
            min-width:90px;
        }

        button:hover{
            background:#5a4bd1;
        }

        input{
            width:250px; /* ✅ prevents stretching */
            padding:7px;
            border-radius:6px;
            border:none;
        }

        .topbar{
            display:flex;
            flex-direction:column;
            align-items:center;
            gap:10px;
            margin-bottom:20px;
        }

        .buttons{
            display:flex;
            gap:10px;
        }

        .msg{
            color:#00ffcc;
            font-size:14px;
        }

        #files{
            margin-top:15px;
        }

        #files div{
            background:#2b2540;
            padding:10px;
            border-radius:6px;
            margin-bottom:8px;
            text-align:center;
        }

        small{
            color:#aaa;
        }
    </style>
</head>

<body>

<div class="box">

    <h1>Cloud Storage</h1>
<div id="currentUser" style="margin-bottom:15px; color:#ccc;"></div>
    <!-- Status + Buttons -->
    <div class="topbar">
        <div id="msg" class="msg"></div>

        <div class="buttons">
            <button onclick="login()">login</button>
            <button onclick="register()">register</button>
            <button onclick="logout()">logout</button>
        </div>
    </div>

    <!-- Folder -->
    <div class="section">
        <div class="row">
            <input id="folderName" placeholder="new folder">
            <button onclick="makeFolder()">create</button>
        </div>
    </div>

    <!-- Upload -->
    <div class="section">
        <div class="row">
     <input type="file" id="fileInput">
            <button onclick="uploadFile()">upload</button>
        </div>
    </div>

    <!-- Refresh -->
    <div class="section">
        <button onclick="loadFiles()">refresh files</button>
    </div>

    <!-- Files -->
    <div id="files"></div>

</div>

<script src="app.js"></script>

</body>
</html>
