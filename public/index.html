<!DOCTYPE html>
<html>
<head>
    <title>cloud app</title>

    <style>
        body{
            font-family: Arial;
            background: linear-gradient(135deg,#070513,#1a1229);
            color:white;
            text-align:center;
        }

        .box{
            background:#1f1b2e;
            padding:25px;
            margin:60px auto;
            width:420px;
            border-radius:12px;
            box-shadow:0 0 20px rgba(0,0,0,0.5);
        }

        button{
            margin:5px;
            padding:6px 12px;
            border:none;
            border-radius:6px;
            background:#6c5ce7;
            color:white;
            cursor:pointer;
        }

        input{
            margin:5px;
            padding:6px;
            border-radius:6px;
            border:none;
        }

        #files{
            margin-top:15px;
            text-align:left;
        }

        .msg{
            margin-top:10px;
            color:#00ffcc;
        }
    </style>
</head>

<body>

<div class="box">
    <h2>cloud storage</h2>

    <button onclick="login()">login</button>
    <button onclick="register()">register</button>
    <button onclick="logout()">logout</button>

    <br><br>

    <input id="folderName" placeholder="folder name">
    <button onclick="makeFolder()">make folder</button>

    <br><br>

    <input type="file" id="fileInput">
    <button onclick="uploadFile()">upload</button>

    <br><br>

    <button onclick="loadFiles()">refresh files</button>

    <div id="msg" class="msg"></div>

    <div id="files"></div>
</div>

<script src="app.js"></script>

</body>
</html>
