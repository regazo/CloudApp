<!DOCTYPE html>
<html>
<head>
    <title>cloud app</title>

    <style>
        body{
            font-family: Arial;
            background:#f4f4f4;
            text-align:center;
        }

        .box{
            background:white;
            padding:20px;
            margin:50px auto;
            width:400px;
            border-radius:8px;
        }

        button{
            margin:5px;
            padding:5px 10px;
        }

        input{
            margin:5px;
            padding:5px;
        }

        #files{
            margin-top:15px;
            text-align:left;
        }

        .msg{
            margin-top:10px;
            color:green;
        }
    </style>
</head>

<body>

<div class="box">
    <h2>my storage or smth</h2>

    <button onclick="login()">login</button>
    <button onclick="register()">register</button>
    <button onclick="logout()">logout</button>

    <br><br>

    <input id="folderName" placeholder="folder name">
    <button onclick="makeFolder()">make folder</button>

    <br><br>

    <input type="file" id="fileInput">
    <button onclick="uploadFile()">upload</button>

    <br><br>

    <button onclick="loadFiles()">refresh</button>

    <div class="msg" id="msg"></div>

    <div id="files"></div>
</div>

<script src="app.js"></script>

</body>
</html>
