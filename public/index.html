<!DOCTYPE html>
<html>
<head>
    <title>Cloud Storage</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

    <style>
        body{
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg,#070513,#1a1229);
            color:white;
            margin:0;
            height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
        }

        .box{
            background: rgba(31,27,46,0.85);
            backdrop-filter: blur(10px);
            padding:35px;
            width:520px;
            border-radius:16px;
            text-align:center;
            box-shadow: 0 0 25px rgba(0,0,0,0.4);
        }

        h1{margin-bottom:10px;}

        #msg{margin-bottom:10px;color:#a29bfe;}
        #currentUser{font-size:14px;margin-bottom:15px;}

        .row{
            display:flex;
            justify-content:center;
            gap:10px;
            margin-bottom:15px;
        }

        input{
            padding:8px;
            border-radius:8px;
            border:none;
            width:70%;
        }

        button{
            padding:8px 14px;
            border:none;
            border-radius:8px;
            background:#6c5ce7;
            color:white;
            cursor:pointer;
        }

        button:hover{background:#5a4bd1;}

        #files div{
            margin:6px;
            background:#2b2540;
            padding:10px;
            border-radius:8px;
            display:flex;
            justify-content:space-between;
        }
    </style>
</head>

<body>

<div class="box">

<h1>Cloud Storage</h1>

<div id="msg"></div>
<div id="currentUser"></div>

<div id="authSection" class="row">
    <button onclick="login()">Login</button>
    <button onclick="register()">Register</button>
    <button onclick="googleLogin()">Google</button>
</div>

<div id="appContent" style="display:none;">

<button onclick="logout()">Logout</button>

<div class="row">
    <input id="folderName" placeholder="New folder">
    <button onclick="makeFolder()">Create</button>
</div>

<div class="row">
    <input type="file" id="fileInput">
    <button onclick="uploadFile()">Upload</button>
</div>

<button onclick="loadFiles()">Refresh</button>

<div id="files"></div>

</div>

</div>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>

<script src="login.js"></script>
<script src="app.js"></script>

</body>
</html>
